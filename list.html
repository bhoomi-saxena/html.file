<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>List HTML</title>
    </head>
    <body>
        <!-- Unordered List -->
        <h3>Grocery Items :</h3>
        <ul type="square">
            <li>Ginger</li>
            <li>Tea Leaves</li>
            <li>Sugar</li>
            <li>Milk</li>
        </ul>

        <!-- Ordered List -->
         <h3>Day's Name</h3>
        <ol type="1">
            <li>Sunday</li>
            <ul>
            <li>Holiday on Sunday.</li>
            <li>On every Sunday.</li>
            </ul>
            <li>Monday</li>
            <li>Tuesday</li>
            <li>Wednesday</li>
            <li>Thursday</li>
            <li>Friday</li>
            <li>Saturday</li>
        </ol>

    </body>
</html>
